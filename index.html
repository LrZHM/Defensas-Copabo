<title>CopaboInfra Inspeção Defensas</title>
<style>
:root{--navy:#123d59;--blue:#0879a8;--bg:#f2f5f7;--card:#fff;--ink:#172b38;--muted:#647582;--line:#d8e0e5;--green:#167346;--amber:#a76500;--red:#b42318}
*{box-sizing:border-box}
html,body{touch-action:pan-x pan-y;-webkit-touch-callout:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Arial,sans-serif}
#app{max-width:850px;margin:auto;padding:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:white;padding:15px;border-radius:14px;margin-bottom:16px}
.brand{font-weight:800;letter-spacing:.3px}
.sub{font-size:12px;opacity:.8}
h1{font-size:23px;margin:12px 0 4px}
h2{font-size:18px;margin:8px 0}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.btn{border:0;border-radius:9px;background:var(--blue);color:white;padding:11px 15px;font:600 14px system-ui;cursor:pointer}
.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}
.btn.rename{background:#555f66;color:#fff;border:1px solid #41494f}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:1200;display:grid;place-items:center;padding:18px}.modal{background:#fff;border-radius:14px;padding:18px;width:min(480px,100%);max-height:80vh;overflow:auto;box-shadow:0 12px 36px rgba(0,0,0,.3)}.modal-list{display:grid;gap:8px;margin:12px 0}.modal-list label{display:flex;align-items:center;gap:9px;margin:0;color:var(--ink)}.modal-list input{width:18px;height:18px}
.btn.danger{background:#fff1f0;color:var(--red);border:1px solid #f2c4c0}
.btn.full{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:white;border:1px solid var(--line);border-radius:11px;padding:13px;margin:8px 0;cursor:pointer}
.item small{display:block;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font:inherit}
textarea{min-height:75px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.photo{border:1px dashed #9aabb7;border-radius:10px;padding:8px;background:white}
.photo img{width:100%;height:150px;object-fit:contain;background:#eef2f4;border-radius:6px}
.photo button{margin-top:6px}
.pill{border-radius:30px;padding:4px 9px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.ok{color:var(--green);border-color:#80b99c}
.bad{color:var(--red);border-color:#e6a29d}
.warn{color:var(--amber);border-color:#e7c17e}
.row{border-top:1px solid var(--line);padding:10px 0}
.topline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.muted{overflow-wrap:anywhere}
.card{overflow:hidden}
input[type=date],input[type=time],input[type=datetime-local]{display:block;width:100%;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;text-align:center;min-height:44px;margin:0}
input[type=date]::-webkit-date-and-time-value{text-align:center;min-width:0;margin:0}
input[type=date]::-webkit-datetime-edit{padding:0}
.sec-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:8px 0}
.sec-actions .btn{width:100%;text-align:center;padding:11px 12px;font-size:14px}
.foot{text-align:center;color:var(--muted);font-size:11px;padding:20px}
.status{padding:9px;background:#e8f2f7;border-radius:8px;color:#17435b;font-size:13px}
.setting-img{max-width:180px;max-height:80px;object-fit:contain;display:block;margin:8px 0}
.component{border-top:1px solid var(--line);padding:12px 0;font-size:13px}
.component .comp-head{display:grid;grid-template-columns:1fr 82px 112px 130px;gap:8px;align-items:center}
.component input.qty{padding:9px 4px;text-align:center}
.component textarea.bg-y{background:#fff3a8}.component textarea.bg-r{background:#ffc9c9}.component textarea.bg-g{background:#c8f0d0}
.sw-row{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.sw.on{border-color:var(--navy);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--navy)}
.sw.c0{background:#fff}.sw.cy{background:#fff3a8}.sw.cr{background:#ffc9c9}.sw.cg{background:#c8f0d0}
.component textarea{min-height:52px;margin-top:6px;font-size:13px}

@media (min-width:761px) and (max-width:1180px){
  #app{max-width:1120px;padding:22px}
  .head{padding:18px 22px}
  .card{padding:18px;margin:14px 0}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .component .comp-head{grid-template-columns:minmax(0,1fr) 100px 130px 150px;gap:10px}
  .sec-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .btn{min-height:46px;padding:12px 16px}
  input,select,textarea{min-height:46px;font-size:16px}
}
@media (min-width:900px) and (max-width:1180px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:761px) and (max-width:1024px) and (orientation:portrait){
  #app{max-width:900px;padding:18px}
  .component .comp-head{grid-template-columns:minmax(0,1fr) 92px 118px}
  .component .comp-head>span{grid-column:1/-1}
}
@media (min-width:761px) and (max-width:1180px){
  #cam .cam-bar,#ed .ed-bar{padding:14px 22px}
  .ed-tools{justify-content:center;gap:10px;padding:12px 18px}
  .ed-tools button{min-height:44px;padding:10px 14px}
  #ed canvas{max-height:calc(100dvh - 190px)}
}

@media(max-width:760px){
  html{min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{min-height:100vh;min-height:100dvh}
  #app{
    width:100%;min-height:100vh;min-height:100dvh;max-width:850px;
    margin-inline:auto;display:flex;flex-direction:column;
    justify-content:flex-start;
    padding: max(16px, env(safe-area-inset-top, 0px)) 14px max(20px, env(safe-area-inset-bottom, 0px));
  }
  #app>*{flex:0 0 auto}
  .head{padding:14px;gap:10px;margin-bottom:18px}
  h1{font-size:clamp(21px,5.5vw,25px)}
  .card{padding:14px;margin:10px 0}
  .btn{min-height:44px;padding:11px 14px;touch-action:manipulation}
  input,select,textarea{font-size:16px;min-height:44px}
  .item{min-height:56px;padding:14px;gap:10px}
  .actions{gap:8px}
  .grid{grid-template-columns:1fr;gap:8px}
  .component .comp-head{grid-template-columns:minmax(0,1fr) minmax(92px,1.4fr)}
  .component .comp-head>span{grid-column:1/-1}
}
@media(max-width:520px){
  #app{padding-left:12px;padding-right:12px}
  .head{padding:12px}
  .head .sub{font-size:11px}
  .topline{align-items:center}
  .topline h2{min-width:0;overflow-wrap:anywhere}
  .btn.full{width:100%}
}
@media(max-height:620px) and (max-width:760px){
  #app{justify-content:flex-start;padding-top:max(12px,env(safe-area-inset-top,0px))}
}
.item.dragging{opacity:.95;border-color:var(--blue);background:#f7fbfe;z-index:50}
.item .handle{cursor:grab;color:var(--muted);font-size:22px;line-height:1;padding:10px 12px 10px 4px;user-select:none;touch-action:none;-webkit-user-select:none}
.item .handle:active{cursor:grabbing;color:var(--blue)}
.item{touch-action:pan-y;-webkit-user-select:none;user-select:none}
body.reordering{overflow:hidden;touch-action:none}
.btn.pick-mode{border:2px solid var(--blue);color:var(--blue);background:#fff;min-height:48px;transition:background .12s,color .12s;-webkit-tap-highlight-color:transparent}
.btn.pick-mode:active,.btn.pick-mode.on{background:var(--blue);color:#fff}
#toTop{position:fixed;right:16px;bottom:22px;z-index:700;width:48px;height:48px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:22px;font-weight:700;box-shadow:0 4px 14px rgba(18,61,89,.35);cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
#toTop.show{display:flex}
#items.reordering{touch-action:none}
#items.reordering .item{touch-action:none}

.component textarea.bg-b{background:#cfe6ff}
.obs{display:grid;grid-template-columns:1fr 40px;gap:6px;align-items:start;margin-top:6px}
.component .obs textarea{margin-top:0}
.pal-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;padding:0;font-size:18px;line-height:1;cursor:pointer}
#pal{position:fixed;z-index:900;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;display:flex;gap:9px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
#pal button{width:34px;height:34px;border-radius:50%;border:2px solid #9aabb7;padding:0;cursor:pointer}
#pal button.on{border-color:var(--navy);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--navy)}
.cam-info .c1,.cam-info .c2,.cam-info .c3{display:block}.cam-info .c2,.cam-info .c3{margin-top:4px}
@media (orientation:landscape){.cam-info{left:12px;right:12px;bottom:92px;max-width:none;display:flex;gap:18px;align-items:flex-end}.cam-info .c2{flex:1;margin-top:0}.cam-info .c3{margin-top:0}.cam-info .t{font-size:24px}}
#cam,#ed{position:fixed;inset:0;background:#000;z-index:1000;display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
#cam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.cam-info{position:absolute;left:10px;bottom:112px;max-width:82%;background:transparent;padding:8px 11px;border-radius:10px;font-size:12px;line-height:1.35;pointer-events:none}
.cam-info .t{display:block;font-size:30px;font-weight:800;line-height:1.1}
.cam-orientation-hint{align-self:center;margin:0 auto 6px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.92);font-size:12px;font-weight:500;letter-spacing:.2px;text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cam-bar,.ed-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#000}
#camShot{width:70px;height:70px;border-radius:50%;border:5px solid #fff;background:#e5e5e5;padding:0}
#camShot:active{background:#bbb}
.ed-top{padding:10px 14px;font-size:13px;background:#000}
#ed canvas{display:block;flex:1;min-height:0;min-width:0;width:100%;height:100%;max-width:100%;object-fit:contain;touch-action:none;background:#111}
.ed-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:#111}
.ed-tools button{background:#2a2f33;color:#fff;border:1px solid #444;padding:8px 11px;border-radius:8px;font:600 13px system-ui}
.ed-tools button.on{background:var(--blue);border-color:#fff}
.ed-tools .col{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid #444}
.ed-tools .col.on{border-color:#fff}

@media (min-width:761px) and (max-width:1180px){
  #ed .ed-top{font-size:15px;padding:14px 20px}
  #ed .ed-tools{flex-wrap:wrap}
  #ed .ed-tools button{font-size:14px}
}

@media print{
  body{background:white;color:#111}
  #app{max-width:none;padding:0}
  .no-print{display:none!important}
  .print-page{page-break-after:always;padding:8mm 9mm;min-height:275mm}
  .print-page:last-child{page-break-after:auto}
  .pdf-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #777;padding-bottom:8px}
  .pdf-head img{max-width:125px;max-height:48px;object-fit:contain}
  .pdf-title{text-align:center;font-size:14px;font-weight:bold;margin:10px 0}
  .meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}
  .meta-cell{border:1px solid #999;padding:5px;font-size:10px}
  .meta-cell b{display:block;color:#555;font-size:9px}
  .parts{width:100%;border-collapse:collapse;font-size:9px;margin-top:8px}
  .parts td,.parts th{border:1px solid #888;padding:4px;text-align:left}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .photos figure{margin:0}
  .photos img{width:100%;height:95mm;object-fit:contain;border:1px solid #aaa}
  .photos figcaption{font-size:9px}
  .signature{display:flex;align-items:end;justify-content:space-between;margin-top:12px;font-size:10px}
  .signature img{max-width:150px;max-height:55px;object-fit:contain}
  .diagram{max-width:100%;max-height:65mm;object-fit:contain;display:block;margin:8px auto}
  .stamp{font-size:9px;color:#333}
}

.stock-wrap{display:inline-flex;align-items:center;gap:3px;min-width:0}.stock-wrap input.qty{width:100%;min-width:0}.stock-edit{flex:0 0 auto;border:0;background:transparent;color:#53616a;border-radius:7px;padding:7px 9px;font-size:16px;line-height:1;cursor:pointer;opacity:.7;touch-action:manipulation;user-select:none;-webkit-user-select:none}.stock-wrap:hover .stock-edit,.stock-wrap:focus-within .stock-edit{opacity:1}.stock-edit:active{background:#e8edf0}.stock-wrap.is-editing{background:#eef7fb;border-radius:8px;padding:2px}.stock-wrap.is-editing input.qty{border-color:var(--blue);background:#fff}.remove-confirm-btn:hover,.remove-confirm-btn:active{background:#b42318!important;color:#fff!important;border-color:#991b1b!important}

.export-incomplete{display:flex!important;align-items:center!important;justify-content:center!important;gap:10px;margin:18px 0 22px!important;padding:4px 0!important;line-height:1.35;min-width:0;text-align:left;cursor:pointer}
.export-incomplete input[type="checkbox"]{width:20px!important;height:20px!important;min-width:20px!important;min-height:20px!important;max-width:20px!important;max-height:20px!important;padding:0!important;margin:0!important;flex:0 0 20px!important;align-self:center!important;accent-color:var(--blue)}
.export-incomplete span{display:inline-flex!important;align-items:center!important;min-height:20px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.export-help{margin:0 0 18px!important;line-height:1.4}
.material-model{margin:8px 0 14px!important;line-height:1.35;overflow-wrap:anywhere}

.photo-actions{margin-top:8px;display:grid;grid-template-columns:1fr;gap:6px}
.photo-actions .btn{width:100%;min-width:0;white-space:normal;line-height:1.2;padding:11px 10px;margin-top:0}
</style>
</head>

async function diagramSrc(sectorKey) {
  if (!sectorKey) return null;
  if (FIXED_DIAGRAMS[sectorKey]) return FIXED_DIAGRAMS[sectorKey].src;
  const cs = (settings.customSectors || []).find(c => c.key === sectorKey);
  if (cs && cs.diagramRef && FIXED_DIAGRAMS[cs.diagramRef]) return FIXED_DIAGRAMS[cs.diagramRef].src;

const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
let noDB = false;
const mem = { records: new Map(), settings: new Map() };
const openDB = () => new Promise((resolve, reject) => {
  const r = indexedDB.open('copabo-defensas-v2', 1);
  r.onupgradeneeded = () => {
    r.result.createObjectStore('records');
    r.result.createObjectStore('settings');
  };
  r.onsuccess = () => { db = r.result; resolve(); };
  r.onerror = () => reject(r.error);
});

const get = (store, key) => new Promise(resolve => {
  if (!db) return resolve(mem[store].get(key));
  const r = db.transaction(store).objectStore(store).get(key);
  r.onsuccess = () => resolve(r.result);
});

const put = (store, key, val) => new Promise((resolve, reject) => {
  if (!db) { mem[store].set(key, val); return resolve(); }
  const t = db.transaction(store, 'readwrite');
  t.objectStore(store).put(val, key);
  t.oncomplete = () => resolve();
  t.onerror = () => reject(t.error);
});

const del = (store, key) => new Promise((resolve, reject) => {
  if (!db) { mem[store].delete(key); return resolve(); }
  const t = db.transaction(store, 'readwrite');
  t.objectStore(store).delete(key);
  t.oncomplete = () => resolve();
  t.onerror = () => reject(t.error);
});

const key = (si, id) => si + '|' + id;
const extra = () => settings.extra || {};
const removed = () => settings.removed || {};
const list = si => {
  const base = D[si][2]
    .concat((extra()[si] || []).map(id => [id, 'Adicionada']))
    .filter(x => !(removed()[si] || []).includes(x[0]));
  const order = (settings.order && settings.order[si]) || [];
  if (!order.length) return base;
  const map = new Map(base.map(x => [x[0], x]));
  const ordered = [];
  for (const id of order) {
    if (map.has(id)) { ordered.push(map.get(id)); map.delete(id); }
  }
  // append any new ids not yet in saved order
  for (const x of map.values()) ordered.push(x);
  return ordered;
};

function materialsOf(si, v) {
  v = normalizeRecord(v || blank());
  const modelKey = D[si] && D[si][1];
  const base = (M[modelKey]?.i || []).map((p, j) => ({ src: 'base', idx: j, name: p[1] }))
    .filter(x => !(v.removedParts || []).includes(x.idx));
  const extra = (v.extraMaterials || []).map((name, j) => ({ src: 'extra', idx: j, name }));
  return base.concat(extra);
}

function normalizeRecord(v) {
  if (!v) return blank();
  if (!v.partNotes) v.partNotes = {};
  if (!v.partQty) v.partQty = {};
  if (!v.partStockQty || typeof v.partStockQty !== 'object' || Array.isArray(v.partStockQty)) v.partStockQty = {};
  for (const k of Object.keys(v.partStockQty)) {
    const val = String(v.partStockQty[k] ?? '').trim();
    if (val === '' || !/^[0-9]{1,5}$/.test(val)) delete v.partStockQty[k];
    else v.partStockQty[k] = val;
  }
  if (!v.partColors) v.partColors = {};
  if (!Array.isArray(v.extraMaterials)) v.extraMaterials = [];
  if (!Array.isArray(v.removedParts)) v.removedParts = [];
  if (typeof v.noDiagram !== 'boolean') v.noDiagram = !!v.noDiagram;
  for (const k of Object.keys(v.partNotes)) v.partNotes[k] = String(v.partNotes[k] || '').slice(0, 70);
  // Migrate old part values if needed
  if (v.parts) {
    for (const k of Object.keys(v.parts)) {
      const p = v.parts[k];
      if (typeof p === 'string') {
        // map old labels
        if (p === 'OK') v.parts[k] = 'BOM';
        else if (p === 'Com Avarias') v.parts[k] = 'REGULAR';
        else if (p === 'Crítica') v.parts[k] = 'RUIM';
        else if (p === 'Não se aplica') v.parts[k] = '';
      }
    }
  }
  if (v.condition === 'OK') v.condition = 'Selecionar';
  if (v.condition === 'Com Avarias') v.condition = 'COM AVARIAS';
  if (v.condition === 'Crítica') v.condition = 'CRÍTICA';
  if (!COND_DEF.includes(v.condition)) v.condition = 'Selecionar';
  v.criticality = CRIT_AUTO[v.condition] || 'Selecionar';
  return v;
}

function bindReorder(si) {
  const container = document.getElementById('items');
  if (!container) return;

  let dragEl = null;
  let startY = 0;
  let grabOffset = 0;
  let moved = false;
  let active = false;
  let fromIndex = -1;

  const getItems = () => [...container.querySelectorAll('.item[data-id]')];

  async function persistOrder() {
    const ids = getItems().map(el => el.dataset.id);
    settings.order = settings.order || {};
    settings.order[si] = ids;
    await put('settings', 'order', settings.order);
  }

  function clientY(e) {
    if (typeof e.clientY === 'number') return e.clientY;
    if (e.touches && e.touches[0]) return e.touches[0].clientY;
    if (e.changedTouches && e.changedTouches[0]) return e.changedTouches[0].clientY;
    return 0;
  }

  function onStart(e) {
    const handle = e.target.closest('[data-handle]');
    if (!handle) return;
    const item = handle.closest('.item');
    if (!item || !container.contains(item)) return;
    e.preventDefault();
    e.stopPropagation();

    active = true;
    moved = false;
    dragEl = item;
    fromIndex = getItems().indexOf(item);
    startY = clientY(e);
    const rect = item.getBoundingClientRect();
    grabOffset = startY - rect.top;

    dragEl.classList.add('dragging');
    document.body.classList.add('reordering');
    container.classList.add('reordering');
    // keep in document flow (no gap) — only lift visually
    dragEl.style.position = 'relative';
    dragEl.style.zIndex = '50';
    dragEl.style.transition = 'none';
    dragEl.style.pointerEvents = 'none';
    dragEl.style.boxShadow = '0 10px 28px rgba(18,61,89,.3)';
    dragEl.style.transform = 'translateY(0px)';

    if (e.pointerId != null) {
      try { handle.setPointerCapture(e.pointerId); } catch (_) {}
    }
  }

  function onMove(e) {
    if (!active || !dragEl) return;
    e.preventDefault();
    const y = clientY(e);
    if (Math.abs(y - startY) > 3) moved = true;

    // visual follow relative to start
    const dy = y - startY;
    dragEl.style.transform = `translateY(${dy}px)`;

    // reorder when finger crosses a neighbor midpoint
    const items = getItems();
    const idx = items.indexOf(dragEl);
    if (idx < 0) return;
    const h = dragEl.offsetHeight || 56;

    // previous
    if (idx > 0) {
      const prev = items[idx - 1];
      const prevMid = prev.offsetTop + prev.offsetHeight / 2;
      // where the drag center would be in document coords
      const dragCenter = dragEl.offsetTop + dy + h / 2;
      if (dragCenter < prevMid) {
        container.insertBefore(dragEl, prev);
        // re-anchor so the card stays under the finger without jump
        startY = y;
        dragEl.style.transform = 'translateY(0px)';
        if (navigator.vibrate) try { navigator.vibrate(6); } catch (_) {}
        return;
      }
    }
    // next
    if (idx < items.length - 1) {
      const next = items[idx + 1];
      const nextMid = next.offsetTop + next.offsetHeight / 2;
      const dragCenter = dragEl.offsetTop + dy + h / 2;
      if (dragCenter > nextMid) {
        // insert after next
        if (next.nextSibling) container.insertBefore(dragEl, next.nextSibling);
        else container.appendChild(dragEl);
        startY = y;
        dragEl.style.transform = 'translateY(0px)';
        if (navigator.vibrate) try { navigator.vibrate(6); } catch (_) {}
      }
    }
  }

  async function onEnd(e) {
    if (!active) return;
    if (e) e.preventDefault();
    active = false;
    if (!dragEl) return;

    dragEl.style.transform = '';
    dragEl.style.position = '';
    dragEl.style.zIndex = '';
    dragEl.style.transition = '';
    dragEl.style.pointerEvents = '';
    dragEl.style.boxShadow = '';
    dragEl.classList.remove('dragging');
    document.body.classList.remove('reordering');
    container.classList.remove('reordering');

    const didMove = moved || getItems().indexOf(dragEl) !== fromIndex;
    dragEl = null;
    moved = false;
    fromIndex = -1;

    if (didMove) await persistOrder();
  }

  container.addEventListener('pointerdown', onStart);
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onEnd);
  window.addEventListener('pointercancel', onEnd);

  container.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onEnd, { passive: false });
  window.addEventListener('touchcancel', onEnd, { passive: false });

  container.addEventListener('click', e => {
    if (e.target.closest('[data-handle]')) {
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);
}

      if (ctx.measureText(candidate).width <= maxWidth || !line) line = candidate;

    const middle = [...addrLines.map(t => [t, F(small), lineH]), ...labelLines.map(t => [t, F(small, true), lineH])];
    const right = coords.map(t => [t, F(small), lineH]);

    yy = by + pd;
    middle.forEach(([t, font, h]) => { ctx.font = font; ctx.fillText(t, x2, yy, midW); yy += h; });
    yy = by + pd;

    navigator.mediaDevices.enumerateDevices().then(l => { if (l.filter(d => d.kind === 'videoinput').length < 2) flipBtn.style.visibility = 'hidden'; }).catch(() => {});
  }
  const tryStream = async vc => { try { return await navigator.mediaDevices.getUserMedia({ video: vc, audio: false }); } catch (_) { return null; } };
  const size = {};
  flipBtn.onclick = async () => {
    if (switching) return;
    switching = true; flipBtn.disabled = true;
    const next = facing === 'user' ? 'environment' : 'user';
    let curId = '';
    try { curId = stream.getVideoTracks()[0].getSettings().deviceId || ''; } catch (_) {}
    stream.getTracks().forEach(t => t.stop());       // celulares só abrem uma câmera por vez
    let ns = await tryStream({ ...size, facingMode: { exact: next } });
    if (!ns) {
      try {
        const list = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
        const i = list.findIndex(d => d.deviceId === curId), other = list.length > 1 ? list[(i + 1) % list.length] : null;
        if (other) ns = await tryStream({ ...size, deviceId: { exact: other.deviceId } });
      } catch (_) {}
    }
    const ok = !!ns;
    if (!ns) ns = await tryStream({ ...size, facingMode: { ideal: facing } });   // volta à câmera anterior
    if (closed) { if (ns) ns.getTracks().forEach(t => t.stop()); return; }
    if (!ns) { alert('Não foi possível reabrir a câmera.'); close(); return; }
    stream = ns; vid.srcObject = ns;
    if (ok) { facing = next; readFacing(ns); } else alert('Este aparelho não permitiu trocar de câmera.');
    try { await vid.play(); } catch (_) {}
    validateOrientation();
    paintStamp();
    switching = false; flipBtn.disabled = false; validateOrientation();
  };

  box.querySelector('#camX').onclick = close;
  shotBtn.onclick = () => {
    if (!vid.videoWidth || switching) return;
    if (!validateOrientation()) {
      alert(wantedLandscape ? 'Foto não permitida: coloque o aparelho na horizontal.' : 'Foto não permitida: coloque o aparelho na vertical.');
      return;
    }
    const now = new Date(), c = document.createElement('canvas');
    c.width = vid.videoWidth; c.height = vid.videoHeight;
    c.getContext('2d').drawImage(vid, 0, 0);
    const rotationDegrees = wantedLandscape ? physicalCameraRotation(c, true) : 0;
    const pos = geo.pos, addr = addrOf(pos && pos.coords);
    close();
    openEditor(c, { now, pos, addr, realtime: true, rotationDegrees, photoMode }, j);
  };
}

async function photoCapture(j, file, photoMode = 'portrait') {
  photoMode = photoMode === 'landscape' ? 'landscape' : 'portrait';
  const wantedLandscape = photoMode === 'landscape';
  if (!file) return;
  const pos = await new Promise(res => navigator.geolocation ? navigator.geolocation.getCurrentPosition(res, () => res(null), { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }) : res(null));
  if (pos) await lookupAddr(pos.coords);
  const bmp = await createImageBitmap(file);
  const isLandscapeImg = bmp.width > bmp.height;
  if (wantedLandscape !== isLandscapeImg) {
    alert(wantedLandscape ? 'Foto não permitida: selecione ou tire uma imagem horizontal.' : 'Foto não permitida: selecione ou tire uma imagem vertical.');
    if (bmp.close) bmp.close();
    return;
  }
  const ts = file.lastModified || Date.now();
  openEditor(bmp, { now: new Date(ts), pos, addr: addrOf(pos && pos.coords), realtime: Math.abs(Date.now() - ts) < 6e5, photoMode }, j);
}

/* ===================================================================
   GERADOR DE PDF PRÓPRIO — A4 paisagem, 1 folha por defensa
   Não usa window.print() (o iOS imprimia a tela do app em vez do relatório).
   Cada folha é desenhada em canvas (297x210 mm) e embutida em um PDF real.
   Funciona offline, sem bibliotecas externas.
   =================================================================== */
const PW = 297, PH = 210, K = 11; // 11 px por mm => 3267 x 2310 px (~280 dpi)
const mm = v => v * K;
const FONT = (s, b) => `${b ? 'bold ' : ''}${(s * K).toFixed(1)}px Arial, Helvetica, sans-serif`;
const fmtISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') ? s.split('-').reverse().join('/') : (s || '');

function loadImg(src) {
  return new Promise(res => {
    if (!src) return res(null);
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}

function wrapLines(ctx, text, font, maxW) {
  ctx.font = font;
  const out = [];
  for (const para of String(text ?? '').split(/\n/)) {
    let line = '';
    for (const w of para.split(/\s+/).filter(Boolean)) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width <= maxW) { line = t; continue; }
      if (line) { out.push(line); line = ''; }
      let cur = '';
      for (const ch of w) {
        if (ctx.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ch; }
        else cur += ch;
      }
      line = cur;
    }
    out.push(line);
  }
  return out;
}

function fitWrap(ctx, text, maxW, maxLines, fs0, fsMin, bold) {
  let fs = fs0, lines = wrapLines(ctx, text, FONT(fs, bold), mm(maxW));
  while (lines.length > maxLines && fs > fsMin) {
    fs = Math.max(fsMin, fs - 0.1);
    lines = wrapLines(ctx, text, FONT(fs, bold), mm(maxW));
  }
  return { fs, lines: lines.slice(0, maxLines) };
}

function drawContain(ctx, img, x, y, w, h, align) {
  if (!img) return;
  const s = Math.min(mm(w) / img.width, mm(h) / img.height);
  const dw = img.width * s, dh = img.height * s;
  let dx = mm(x) + (mm(w) - dw) / 2;
  if (align === 'left') dx = mm(x);
  if (align === 'right') dx = mm(x) + mm(w) - dw;
  ctx.drawImage(img, dx, mm(y) + (mm(h) - dh) / 2, dw, dh);
}

function trimWhite(img) {
  if (!img) return null;
  const W = img.width, H = img.height, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0);
  const px = x.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
    const i = (y * W + xx) * 4;
    if (px[i + 3] > 20 && (px[i] < 215 || px[i + 1] < 215 || px[i + 2] < 215)) {
      if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  if (x1 < 0) return img;
  const p = Math.round(Math.max(W, H) * 0.008);
  x0 = Math.max(0, x0 - p); y0 = Math.max(0, y0 - p); x1 = Math.min(W - 1, x1 + p); y1 = Math.min(H - 1, y1 + p);
  const o = document.createElement('canvas');
  o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  const ox = o.getContext('2d');
  ox.fillStyle = '#fff'; ox.fillRect(0, 0, o.width, o.height);
  ox.drawImage(c, -x0, -y0);
  return o;
}

function renderPage(ctx, d) {
  const W = mm(PW), H = mm(PH);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'top';

  const T = (t, x, y, fs, o = {}) => {
    ctx.font = FONT(fs, o.b);
    ctx.fillStyle = o.c || '#111';
    ctx.textAlign = o.a || 'left';
    if (o.w) ctx.fillText(String(t), mm(x), mm(y), mm(o.w)); else ctx.fillText(String(t), mm(x), mm(y));
  };
  const R = (x, y, w, h, fill, stroke, lw) => {
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(mm(x), mm(y), mm(w), mm(h)); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = mm(lw || 0.2); ctx.strokeRect(mm(x), mm(y), mm(w), mm(h)); }
  };
  const Ln = (x1, y1, x2, y2, c, lw) => {
    ctx.strokeStyle = c; ctx.lineWidth = mm(lw || 0.2);
    ctx.beginPath(); ctx.moveTo(mm(x1), mm(y1)); ctx.lineTo(mm(x2), mm(y2)); ctx.stroke();
  };

  const X0 = 6, Y0 = 6, CW = 285;

  /* ---------- Cabeçalho (logos grandes) ---------- */
  const LH = 20, LW = 92;
  const dw = im => im ? Math.min(LW, LH * im.width / im.height) : 30;
  if (d.logo1) drawContain(ctx, d.logo1, X0, Y0, LW, LH, 'left');
  else T('COPABO INFRA', X0, Y0 + 6, 5.5, { b: 1 });
  if (d.logo2) drawContain(ctx, d.logo2, X0 + CW - LW, Y0, LW, LH, 'right');
  else T('APS', X0 + CW, Y0 + 6, 5.5, { b: 1, a: 'right' });
  const tx1 = X0 + dw(d.logo1) + 4, tx2 = X0 + CW - dw(d.logo2) - 4;
  const tf = fitWrap(ctx, 'FOLHA DE INSPEÇÃO TÉCNICA DE SISTEMAS DE DEFENSAS', tx2 - tx1, 2, 4.8, 2.8, true);
  const tH = tf.lines.length * tf.fs * 1.25;
  tf.lines.forEach((ln, k) => T(ln, (tx1 + tx2) / 2, Y0 + (LH - tH) / 2 + k * tf.fs * 1.25, tf.fs, { b: 1, a: 'center' }));
  Ln(X0, Y0 + LH + 1.2, X0 + CW, Y0 + LH + 1.2, '#222', 0.45);

  /* ---------- Metadados ---------- */
  const my = 28.8, mh = 11.3, mg = 1, mw = (CW - 7 * mg) / 8;
  d.meta.forEach((c, i) => {
    const cx = X0 + i * (mw + mg);
    R(cx, my, mw, mh, c.bg || null, '#888', 0.2);
    T(c.l.toUpperCase(), cx + 1, my + 0.8, 1.9, { b: 1, c: c.fg ? '#f6d5d5' : '#555' });
    const f = fitWrap(ctx, c.v, mw - 2, 2, 2.9, 1.8, !!c.fg);
    f.lines.forEach((ln, k) => T(ln, cx + 1, my + 3.5 + k * f.fs * 1.18, f.fs, { b: !!c.fg, c: c.fg || '#111' }));
  });

  /* ---------- Bloco principal ---------- */
  const mainY = my + mh + 1.7, bottomY = 137.5, mainH = bottomY - 2 - mainY;
  const useDiag = !d.noDiagram;
  const leftW = useDiag ? 84 : 0, gap = useDiag ? 3 : 0, rightX = X0 + leftW + gap, rightW = CW - leftW - gap;

  if (useDiag) {
    R(X0, mainY, leftW, mainH, '#fff', '#888', 0.2);
    T('DIAGRAMA ESQUEMÁTICO', X0 + leftW / 2, mainY + 1.3, 2.6, { b: 1, c: '#123d59', a: 'center' });
    Ln(X0 + 1, mainY + 5.2, X0 + leftW - 1, mainY + 5.2, '#ccc', 0.2);
    let notesH = 0;
    if (d.notes) {
      const nf = fitWrap(ctx, 'Observações: ' + d.notes, leftW - 4, 8, 2.4, 1.8, false);
      notesH = nf.lines.length * nf.fs * 1.2 + 2;
      const ny = mainY + mainH - notesH - 1;
      R(X0 + 1, ny, leftW - 2, notesH, '#fafafa', '#ccc', 0.15);
      nf.lines.forEach((ln, k) => T(ln, X0 + 2, ny + 1 + k * nf.fs * 1.2, nf.fs));
      notesH += 1.5;
    }
    const dY = mainY + 6, dH = mainH - 7 - notesH;
    if (d.diagram) drawContain(ctx, d.diagram, X0 + 1, dY, leftW - 2, dH);
    else T('Diagrama não cadastrado', X0 + leftW / 2, dY + dH / 2 - 1.5, 2.8, { c: '#777', a: 'center' });
  }

  const useQuantity = d.useQuantity !== false;
  const cols = useQuantity ? (useDiag ? [7, 12, 58, 14, rightW - 7 - 12 - 58 - 14] : [8, 16, 105, 22, rightW - 8 - 16 - 105 - 22]) : (useDiag ? [8, 72, 14, rightW - 8 - 72 - 14] : [10, 135, 24, rightW - 10 - 135 - 24]);
  const layoutTable = fs => {
    const lh = fs * 1.2, pad = 1.3;
    const rows = d.rows.map(r => {
      const descCol = useQuantity ? 2 : 1;
      const resCol = useQuantity ? 4 : 3;
      const dl = wrapLines(ctx, r.desc, FONT(fs), mm(cols[descCol] - 2));
      const rl = wrapLines(ctx, r.res, FONT(fs), mm(cols[resCol] - 2));
      return { dl, rl, h: Math.max(dl.length, rl.length, 1) * lh + pad };
    });
    const hdrH = 2 * lh + pad;
    return { lh, pad, hdrH, rows, total: hdrH + rows.reduce((a, r) => a + r.h, 0) };
  };
  let fs = 2.6, Lt = layoutTable(fs);
  while (Lt.total > mainH && fs > 1.4) { fs -= 0.05; Lt = layoutTable(fs); }

  let ty = mainY, tx = rightX;
  const heads = useQuantity ? ['POS', 'QUANT.', 'DESCRIÇÃO', 'QTD. AVARIADA', 'RESULTADO DA INSPEÇÃO'] : ['POS', 'DESCRIÇÃO', 'QTD. AVARIADA', 'RESULTADO DA INSPEÇÃO'];
  const hfs = fs * 0.92;
  let cxp = tx;
  heads.forEach((hd, i) => {
    R(cxp, ty, cols[i], Lt.hdrH, '#eef2f5', '#888', 0.15);
    const hl = wrapLines(ctx, hd, FONT(hfs, 1), mm(cols[i] - 1));
    const startY = ty + (Lt.hdrH - hl.length * Lt.lh) / 2 + 0.1;
    const leftAligned = useQuantity ? (i === 2 || i === 4) : (i === 1 || i === 3);
    hl.forEach((ln, k) => T(ln, leftAligned ? cxp + 1 : cxp + cols[i] / 2, startY + k * Lt.lh, hfs, { b: 1, a: leftAligned ? 'left' : 'center' }));
    cxp += cols[i];
  });
  ty += Lt.hdrH;
  d.rows.forEach((r, j) => {
    const Lr = Lt.rows[j];
    let cx = tx;
    cols.forEach((w, i) => {
      const tinted = useQuantity ? (i === 3 || i === 4) : (i === 2 || i === 3); // QTD. AVARIADA + RESULTADO
      R(cx, ty, w, Lr.h, tinted && r.bg ? r.bg : null, '#888', 0.15);
      cx += w;
    });
    const y0 = ty + Lt.pad / 2;
    T(j + 1, tx + cols[0] / 2, y0, fs, { a: 'center' });
    if (useQuantity) {
      T(r.stock, tx + cols[0] + cols[1] / 2, y0, fs, { a: 'center' });
      Lr.dl.forEach((ln, k) => T(ln, tx + cols[0] + cols[1] + 1, y0 + k * Lt.lh, fs));
      T(r.q, tx + cols[0] + cols[1] + cols[2] + cols[3] / 2, y0, fs, { a: 'center' });
      Lr.rl.forEach((ln, k) => T(ln, tx + cols[0] + cols[1] + cols[2] + cols[3] + 1, y0 + k * Lt.lh, fs));
    } else {
      Lr.dl.forEach((ln, k) => T(ln, tx + cols[0] + 1, y0 + k * Lt.lh, fs));
      T(r.q, tx + cols[0] + cols[1] + cols[2] / 2, y0, fs, { a: 'center' });
      Lr.rl.forEach((ln, k) => T(ln, tx + cols[0] + cols[1] + cols[2] + 1, y0 + k * Lt.lh, fs));
    }
    ty += Lr.h;
  });

  /* ---------- Registro fotográfico (3 fotos grandes) + visto ---------- */
  const sigW = 50, pg = 3, pw = (CW - sigW - 4 - 2 * pg) / 3, py = bottomY + 3.6, ph = 54;
  T('REGISTRO FOTOGRÁFICO', X0, bottomY, 2.6, { b: 1, c: '#123d59' });
  d.photos.forEach((p, j) => {
    const px = X0 + j * (pw + pg);
    R(px, py, pw, ph, '#fafafa', '#aaa', 0.2);
    if (p.img) {
      let imgToDraw = p.img;
      // Se foi marcada como horizontal mas por algum motivo veio em pé, gira para paisagem no PDF
      if (p.mode === 'landscape' && p.img.height > p.img.width) {
        const rot = document.createElement('canvas');
        rot.width = p.img.height;
        rot.height = p.img.width;
        const rctx = rot.getContext('2d');
        rctx.translate(rot.width, 0);
        rctx.rotate(Math.PI / 2);
        rctx.drawImage(p.img, 0, 0);
        imgToDraw = rot;
      }
      drawContain(ctx, imgToDraw, px + 0.3, py + 0.3, pw - 0.6, ph - 0.6);
    } else T('Sem foto', px + pw / 2, py + ph / 2 - 1.3, 2.6, { c: '#777', a: 'center' });
    T(`FOTO ${j + 1} — ${p.label}`, px, py + ph + 0.8, 2.2, { b: 1, w: pw });
    if (p.meta) {
      wrapLines(ctx, p.meta, FONT(1.9), mm(pw)).slice(0, 2).forEach((ln, k) => T(ln, px, py + ph + 3.4 + k * 2.3, 1.9, { c: '#222' }));
    }
  });

  const sx = X0 + CW - sigW;
  T('Visto Copabo Infra', sx + sigW / 2, bottomY, 2.8, { b: 1, a: 'center' });
  R(sx, py, sigW, 31, '#fff', '#999', 0.2);
  if (d.sig) drawContain(ctx, d.sig, sx + 1, py + 1, sigW - 2, 29);
  else T('Assinatura digital não cadastrada', sx + sigW / 2, py + 14, 2.2, { c: '#777', a: 'center' });
  T('Visto Fiscalização Cliente:', sx + sigW / 2, py + 35, 2.6, { a: 'center' });
  Ln(sx + 2, py + 48, sx + sigW - 2, py + 48, '#222', 0.2);
}

const canvasToJpegBytes = (c, q) => new Promise(res => {
  c.toBlob(async b => {
    if (b) return res(new Uint8Array(await b.arrayBuffer()));
    const bin = atob(c.toDataURL('image/jpeg', q).split(',')[1]);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    res(u);
  }, 'image/jpeg', q);
});

function buildPdfBlob(pages) {
  const enc = new TextEncoder();
  const parts = [], offs = [];
  let off = 0;
  const push = b => { if (typeof b === 'string') b = enc.encode(b); parts.push(b); off += b.length; };
  const obj = (id, fn) => { offs[id] = off; push(`${id} 0 obj\n`); fn(); push('\nendobj\n'); };
  const n = pages.length;
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${pages.map((_, i) => `${3 + 3 * i} 0 R`).join(' ')}] /Count ${n} >>`));
  pages.forEach((p, i) => {
    const pg = 3 + 3 * i, ct = 4 + 3 * i, im = 5 + 3 * i;
    const cs = 'q 841.89 0 0 595.28 0 0 cm /Im0 Do Q';
    obj(pg, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`));
    obj(ct, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(im, () => {
      push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`);
      push(p.bytes);
      push('\nendstream');
    });
  });
  const xref = off, total = 3 + 3 * n;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}

function showPdfBox(html) {
  let b = document.getElementById('pdfBox');
  if (!b) {
    b = document.createElement('div');
    b.id = 'pdfBox';
    b.style.cssText = 'position:fixed;inset:0;z-index:2000;background:rgba(10,25,35,.88);display:flex;align-items:center;justify-content:center;padding:20px';

  return b;
}
const closePdfBox = () => { const b = document.getElementById('pdfBox'); if (b) b.remove(); };
let lastPdfUrl = null;

function pdfDone(blob, name, nPages) {
  if (lastPdfUrl) { try { URL.revokeObjectURL(lastPdfUrl); } catch (_) {} }
  const url = lastPdfUrl = URL.createObjectURL(blob);
  const file = new File([blob], name, { type: 'application/pdf' });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  const mb = (blob.size / 1048576).toFixed(1);
  const box = showPdfBox(`<b style="font-size:17px">PDF pronto ✓</b>
    <p class="muted" style="margin:6px 0 12px">${nPages} folha${nPages > 1 ? 's' : ''} A4 paisagem · ${mb} MB</p>
    ${canShare ? '<button class="btn full" id="pdfShare">Compartilhar / Salvar em Arquivos</button>' : ''}
    <button class="btn ${canShare ? 'secondary' : ''} full" style="margin-top:8px" id="pdfOpen">Abrir PDF</button>
    <button class="btn secondary full" style="margin-top:8px" id="pdfDl">Baixar</button>
    <button class="btn secondary full" style="margin-top:8px" id="pdfClose">Fechar</button>`);
  const $ = id => box.querySelector('#' + id);
  if (canShare) $('pdfShare').onclick = async () => {
    try { await navigator.share({ files: [file], title: name }); }
    catch (e) { if (e && e.name !== 'AbortError') alert('Não foi possível compartilhar: ' + (e.message || e)); }
  };
  $('pdfOpen').onclick = () => {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
  };
  $('pdfDl').onclick = () => {
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  };
  $('pdfClose').onclick = closePdfBox;
}

async function buildPrint(jobs) {
  showPdfBox('<b>Gerando PDF…</b><p class="muted" id="pdfProg" style="margin:8px 0 0">Preparando…</p>');
  const setProg = t => { const e = document.getElementById('pdfProg'); if (e) e.textContent = t; };
  try {
    const logo1 = trimWhite(await loadImg(LOGO1_SRC || await asset('logoCopabo')));
    const logo2 = trimWhite(await loadImg(LOGO2_SRC || await asset('logoPorto')));
    const { name: inspector, sig: sigData } = await getInspectorInfo();
    const sig = trimWhite(await loadImg(sigData));
    const contract = (settings.contractNumber || await get('settings', 'contractNumber') || 'SPA/12.2025').trim() || 'SPA/12.2025';
    const contractor = (settings.contractor || await get('settings', 'contractor') || 'Autoridade Portuária de Santos').trim() || 'Autoridade Portuária de Santos';
    const diagCache = {};
    const cv = document.createElement('canvas');
    cv.width = mm(PW); cv.height = mm(PH);
    const ctx = cv.getContext('2d');
    const pages = [];

    for (let n = 0; n < jobs.length; n++) {
      setProg(`Página ${n + 1} de ${jobs.length}`);
      await new Promise(r => setTimeout(r, 15)); // deixa a tela atualizar
      const { si, id, v: raw } = jobs[n];
      const v = normalizeRecord(raw);
      const s = D[si];
      const bInfo = BERCO_INFO[si] || { berco: s[0], sigla: '' };
      const defLabel = bInfo.sigla ? `${id}-${bInfo.sigla}` : id;
      const m = M[s[1]] || { i: [] };
      const crit = CRIT_AUTO[v.condition] || '—';
      const cbg = CRIT_BG[crit] || null;
      const cfg = crit === 'Grau 3' ? '#ffffff' : null;
      if (s[1] && !(s[1] in diagCache)) diagCache[s[1]] = await loadImg(await diagramSrc(s[1]));
      const mats = materialsOf(si, v);
      const rows = mats.map((m) => {
        const key = m.src + ':' + m.idx;
        const legacy = m.src === 'base' ? m.idx : 'e' + m.idx;
        const status = v.parts[key] || v.parts[legacy] || 'Não avaliado';
        const pn = v.partNotes[key] || v.partNotes[legacy];
        const note = pn ? ` — ${String(pn).slice(0, 70)}` : '';
        const q0 = (v.partQty && (v.partQty[key] ?? v.partQty[legacy]));
        const hasCustomStock = v.partStockQty && (key in v.partStockQty || legacy in v.partStockQty);
        const stock0 = hasCustomStock ? (v.partStockQty[key] ?? v.partStockQty[legacy]) : '';
        const col = (v.partColors || {})[key] || (v.partColors || {})[legacy];
        return { desc: m.name, stock: (stock0 === undefined || stock0 === null || stock0 === '') ? '—' : String(stock0), q: (q0 === undefined || q0 === null || q0 === '') ? '—' : String(q0), res: status + note, bg: PCOL[col] || null };
      });
      const photos = [];
      for (let j = 0; j < L.length; j++) {
        const pm = v.photoMeta[j];
        photos.push({ img: await loadImg(v.photos[j]), label: L[j], meta: pm ? `${pm.date} · ${pm.location}` : '', mode: pm?.mode || '' });
      }
      renderPage(ctx, {
        logo1, logo2, sig, inspector,
        date: v.inspectionDate || '',
        notes: v.notes || '',
        noDiagram: !!v.noDiagram,
        useQuantity: !(typeof v.noQuantity === 'boolean' ? v.noQuantity : !!((settings.customSectors || []).find(cs => cs.key === s[1]) || {}).noQuantity),
        diagram: (!v.noDiagram && s[1]) ? diagCache[s[1]] : null,
        rows, photos,
        meta: [
          { l: 'Contratante', v: contractor },
          { l: 'Berço', v: bInfo.berco },
          { l: 'Defensa', v: defLabel },
          { l: 'Contrato n°', v: contract },
          { l: 'Data de inspeção', v: fmtISO(v.inspectionDate || '') },
          { l: 'Condição', v: v.condition === 'Selecionar' ? '—' : v.condition, bg: cbg, fg: cfg },
          { l: 'Criticidade', v: crit, bg: cbg, fg: cfg },
          { l: 'Inspetor Copabo Infra', v: inspector }
        ]
      });
      pages.push({ bytes: await canvasToJpegBytes(cv, 0.9), w: cv.width, h: cv.height });
      photos.length = 0;
    }

    setProg('Montando o arquivo…');
    await new Promise(r => setTimeout(r, 15));
    const blob = buildPdfBlob(pages);
    const today = isoLocal(new Date());
    const clean = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    const name = jobs.length === 1
      ? `Defensa_${clean(D[jobs[0].si][0])}_${clean(jobs[0].id)}.pdf`
      : `Relatorio_Defensas_${today}.pdf`;
    pdfDone(blob, name, pages.length);
  } catch (err) {
    showPdfBox(`<b>Não foi possível gerar o PDF</b><p class="muted">${esc(err && err.message || err)}</p><p class="muted">Se foram muitas defensas de uma vez, gere por setor.</p><button class="btn full" id="pdfErrClose">Fechar</button>`)
      .querySelector('#pdfErrClose').onclick = closePdfBox;
  }
}

function fileData(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}

async function pdfToImage(file) {
  if (!window.pdfjsLib) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = res;
      s.onerror = () => rej(new Error('Sem conexão para carregar o leitor de PDF.'));
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 2.0 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return canvas.toDataURL('image/png');
}

  if (pencil) {
    pencil.textContent = '✎';
    pencil.title = 'Editar quantidade fixa';
    pencil.setAttribute('aria-label', 'Editar quantidade fixa');
  }
});

app.addEventListener('keydown', e => {
  const input = e.target.closest('[data-stockqty]');
  if (!input || input.readOnly) return;
  if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
  if (e.key === 'Escape') {
    e.preventDefault();
    input.value = current.v?.partStockQty?.[input.dataset.stockqty] ?? '';
    input.blur();
  }
});

app.addEventListener('input', async e => {
  if (e.target.id === 'q') {
    const q = norm(e.target.value.trim());
    let n = 0;
    app.querySelectorAll('.item[data-s]').forEach(el => { const ok = !q || el.dataset.s.includes(q); el.classList.toggle('hidden', !ok); if (ok) n++; });
    const nr = document.getElementById('noRes');
    if (nr) nr.classList.toggle('hidden', n > 0 || !q);
    return;
  }
  if (e.target.id === 'notes' && current.v) {
    current.v.notes = e.target.value;
    await put('records', key(current.si, current.id), current.v);
  }
  if (e.target.dataset.partnote !== undefined && current.v) {
    current.v.partNotes = current.v.partNotes || {};
    current.v.partNotes[e.target.dataset.partnote] = e.target.value.slice(0, 70);
    await put('records', key(current.si, current.id), current.v);
  }
  if (e.target.dataset.partqty !== undefined && current.v) {
    current.v.partQty = current.v.partQty || {};
    current.v.partQty[e.target.dataset.partqty] = e.target.value;
    await put('records', key(current.si, current.id), current.v);
  }
  if (e.target.dataset.stockqty !== undefined && current.v) {
    current.v.partStockQty = current.v.partStockQty || {};
    const value = e.target.value.trim();
    if (value !== '' && !/^[0-9]+$/.test(value)) {
      e.target.value = current.v.partStockQty[e.target.dataset.stockqty] ?? '';
      return alert('Informe uma quantidade inteira válida.');
    }
    if (value === '') delete current.v.partStockQty[e.target.dataset.stockqty];
    else current.v.partStockQty[e.target.dataset.stockqty] = value;
    await put('records', key(current.si, current.id), current.v);
  }
});


function applyCustomSectors() {
  const list = settings.customSectors || [];
  for (const cs of list) {
    if (!cs || !cs.key || !cs.name) continue;
    M[cs.key] = { t: 'f', i: (cs.materials || []).map(m => Array.isArray(m) ? [m[1], m[0]] : [null, m]) };
    const exists = D.findIndex(s => s[1] === cs.key && s[0] === cs.name);
    const defs = (cs.defensas || []).map(id => [String(id), 'Adicionada']);
    if (exists >= 0) D[exists][2] = defs;
    else D.push([cs.name, cs.key, defs]);
    if (typeof BERCO_INFO !== 'undefined') {
      while (BERCO_INFO.length < D.length) BERCO_INFO.push({ berco: '', sigla: '' });
      const i = D.findIndex(s => s[1] === cs.key && s[0] === cs.name);
      if (i >= 0) BERCO_INFO[i] = { berco: cs.name, sigla: cs.sigla || '' };
    }
  }
}


async function renameDefensa(si, oldId) {
  const neu = prompt('Novo nome/identificação da defensa:', oldId)?.trim();
  if (!neu || neu === oldId) return;
  if (list(si).some(x => x[0] === neu)) return alert('Já existe uma defensa com esse nome neste setor.');
  // record
  const rec = await get('records', key(si, oldId));
  if (rec) {
    await put('records', key(si, neu), rec);
    await del('records', key(si, oldId));
  }
  // extra list
  settings.extra = settings.extra || {};
  const ex = settings.extra[si] || [];
  const eix = ex.indexOf(oldId);
  if (eix >= 0) { ex[eix] = neu; settings.extra[si] = ex; await put('settings', 'extra', settings.extra); }
  // in D base list
  const pair = D[si][2].find(x => x[0] === oldId);
  if (pair) pair[0] = neu;
  // custom sector defensas
  const cs = (settings.customSectors || []).find(c => c.key === D[si][1] && c.name === D[si][0]);
  if (cs && Array.isArray(cs.defensas)) {
    const i = cs.defensas.indexOf(oldId);
    if (i >= 0) { cs.defensas[i] = neu; await put('settings', 'customSectors', settings.customSectors); }
  }
  // Persistir renomeação também para defensas dos setores padrão após reiniciar
  settings.defensaRenames = settings.defensaRenames || {};
  settings.defensaRenames[si] = settings.defensaRenames[si] || {};
  for (const k of Object.keys(settings.defensaRenames[si])) {
    if (settings.defensaRenames[si][k] === oldId) settings.defensaRenames[si][k] = neu;
  }
  settings.defensaRenames[si][oldId] = neu;
  await put('settings', 'defensaRenames', settings.defensaRenames);
  // order
  if (settings.order && settings.order[si]) {
    settings.order[si] = settings.order[si].map(x => x === oldId ? neu : x);
    await put('settings', 'order', settings.order);
  }
  // removed
  if (settings.removed && settings.removed[si]) {
    settings.removed[si] = settings.removed[si].map(x => x === oldId ? neu : x);
    await put('settings', 'removed', settings.removed);
  }
  current.id = neu;
  openDef(si, neu);
}

async function renameSector(si) {
  const old = D[si][0];
  const neu = prompt('Novo nome do setor:', old)?.trim();
  if (!neu || neu === old) return;
  if (D.some((s, i) => i !== si && s[0].toLowerCase() === neu.toLowerCase())) return alert('Já existe um setor com esse nome.');
  D[si][0] = neu;
  if (typeof BERCO_INFO !== 'undefined' && BERCO_INFO[si]) BERCO_INFO[si].berco = neu;
  const cs = (settings.customSectors || []).find(c => c.key === D[si][1] && c.name === old);
  if (cs) {
    cs.name = neu;
    await put('settings', 'customSectors', settings.customSectors);
  } else {
    // persist rename for built-in sectors
    settings.sectorRenames = settings.sectorRenames || {};
    settings.sectorRenames[si] = neu;
    await put('settings', 'sectorRenames', settings.sectorRenames);
  }
  sector(si);
}

function addSectorPage() {
  ensureToTop(false);
  const state = { materials: [], defensas: [], noDiagram: false, noQuantity: false, diagramData: null, diagramRef: '', name: '' };
  const paint = () => {
    app.innerHTML = header() + `
      <div class="topline"><button class="btn secondary" data-a="start">‹ Setores</button><h2>Novo setor</h2></div>
      <div class="card">
        <label>Nome do setor * <span class="muted">(só o setor — não altera o nome das defensas)</span></label>
        <input type="text" id="nsName" value="${esc(state.name)}" placeholder="Ex.: Armazém 40" autocomplete="off">
        <div style="margin:12px 0;display:grid;gap:10px">
          <label style="display:flex;gap:10px;align-items:center;cursor:pointer;margin:0">
            <input type="checkbox" id="nsNoQty" ${state.noQuantity ? 'checked' : ''} style="width:19px;height:19px;flex-shrink:0">
            <b>Não usar quantidade de materiais</b>
          </label>
          <label style="display:flex;gap:10px;align-items:center;cursor:pointer;margin:0">
            <input type="checkbox" id="nsNoDiag" ${state.noDiagram ? 'checked' : ''} style="width:19px;height:19px;flex-shrink:0">
            <b>Não usar diagrama neste setor</b>
          </label>
        </div>
        <label>Diagrama do setor ${state.noDiagram ? '(opcional)' : '*'}</label>
        <select id="nsDiagRef">
          <option value="">Anexar novo diagrama</option>
          ${Object.entries(FIXED_DIAGRAMS).map(([k, fd]) => `<option value="${k}" ${state.diagramRef === k ? 'selected' : ''}>Usar pré-definido: ${esc(fd.label)}</option>`).join('')}
        </select>
        ${state.diagramRef
          ? `<img src="${FIXED_DIAGRAMS[state.diagramRef].src}" class="setting-img" style="max-height:180px;margin-top:8px" alt="Diagrama pré-definido">`
          : `<input type="file" id="nsDiag" accept="image/*,application/pdf" style="margin-top:8px">
             ${state.diagramData ? '<p class="muted">Diagrama selecionado ✓</p>' : '<p class="muted">Anexe PNG/JPG/PDF do diagrama</p>'}`}
      </div>
      <div class="card">
        <h2>Materiais do setor * (mín. 1)</h2>
        <p class="muted">Peças/componentes avaliados nas defensas deste setor.</p>
        <ul style="padding-left:18px;margin:8px 0">${state.materials.map((m,i)=>`<li>${esc(m.name)}${state.noQuantity ? '' : ` — Quant.: ${esc(m.qty)}`} <button type="button" data-rm-mat="${i}" class="btn danger" style="padding:4px 8px;font-size:12px;margin-left:6px">Remover</button></li>`).join('') || '<li class="muted">Nenhum ainda</li>'}</ul>
        <div class="actions">
          <input type="text" id="nsMat" placeholder="Nome do material" style="flex:1" autocomplete="off">
          ${state.noQuantity ? '' : '<input type="number" id="nsMatQty" min="0" step="1" placeholder="Quant." style="max-width:105px">'}
          <button type="button" class="btn" id="nsAddMat">Adicionar material</button>
        </div>
      </div>
      <div class="card">
        <h2>Defensas do setor * (mín. 1)</h2>
        <p class="muted">Use o <b>código/nome de cada defensa</b> (ex.: 401, 402.1). Não use o nome do setor.</p>
        <ul style="padding-left:18px;margin:8px 0">${state.defensas.map((m,i)=>`<li><b>Defensa:</b> ${esc(m)} <button type="button" data-rm-def="${i}" class="btn danger" style="padding:4px 8px;font-size:12px;margin-left:6px">Remover</button></li>`).join('') || '<li class="muted">Nenhuma ainda</li>'}</ul>
        <div class="actions">
          <input type="text" id="nsDef" placeholder="Código da defensa (ex.: 401)" style="flex:1" autocomplete="off">
          <button type="button" class="btn" id="nsAddDef">Adicionar defensa</button>
        </div>
      </div>
      <button class="btn full" id="nsSave">Criar setor</button>
      <p class="muted">O setor personalizado usa o diagrama anexado ou o pré-definido escolhido. Se excluído, todas as inspeções e o diagrama dele são apagados.</p>`;
    const $ = id => document.getElementById(id);
    $('nsName').oninput = e => { state.name = e.target.value; };
    $('nsNoDiag').onchange = e => { state.noDiagram = e.target.checked; paint(); };
    $('nsNoQty').onchange = e => { state.noQuantity = e.target.checked; paint(); };
    $('nsDiagRef').onchange = e => { state.diagramRef = e.target.value; if (state.diagramRef) state.diagramData = null; paint(); };
    if ($('nsDiag')) $('nsDiag').onchange = async e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      try {
        const isPdf = f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf');
        state.diagramData = isPdf ? await pdfToImage(f) : await fileData(f);
        paint();
      } catch (err) { alert('Falha ao ler diagrama: ' + (err.message || err)); }
    };
    $('nsAddMat').onclick = () => {
      const v = ($('nsMat').value || '').trim();
      const q = state.noQuantity ? '' : (($('nsMatQty')?.value || '').trim());
      if (!v) return alert('Informe o nome do material.');
      if (!state.noQuantity && (!q || !/^[0-9]+$/.test(q))) return alert('Informe a quantidade inteira do material.');
      state.materials.push({ name: v, qty: q });
      paint();
    };
    $('nsAddDef').onclick = () => {
      const v = ($('nsDef').value || '').trim();
      if (!v) return;
      if (state.defensas.includes(v)) return alert('Defensa já listada.');
      state.defensas.push(v);
      paint();
    };
    app.querySelectorAll('[data-rm-mat]').forEach(b => b.onclick = () => { state.materials.splice(+b.dataset.rmMat, 1); paint(); });
    app.querySelectorAll('[data-rm-def]').forEach(b => b.onclick = () => { state.defensas.splice(+b.dataset.rmDef, 1); paint(); });
    $('nsSave').onclick = async () => {
      const name = (state.name || '').trim();
      if (!name) return alert('Informe o nome do setor.');
      if (state.materials.length < 1) return alert('Adicione pelo menos 1 material.');
      if (state.defensas.length < 1) return alert('Adicione pelo menos 1 defensa.');
      if (!state.noDiagram && !state.diagramData && !state.diagramRef) return alert('Anexe o diagrama, escolha um pré-definido ou marque “Não usar diagrama”.');
      if (D.some(s => s[0].toLowerCase() === name.toLowerCase())) return alert('Já existe um setor com esse nome.');
      const defs = state.defensas.map(d => String(d).trim()).filter(d => d && d.toLowerCase() !== name.toLowerCase());
      if (!defs.length) return alert('Cadastre ao menos uma identificação de defensa diferente do nome do setor.');
      const key = 'c' + Date.now().toString(36);
      const cs = {
        name, key,
        materials: state.materials.map(m => [m.name, state.noQuantity ? null : m.qty]),
        defensas: defs,
        noDiagramDefault: !!state.noDiagram,
        noQuantity: !!state.noQuantity,
        diagramRef: state.diagramRef || '',
        sigla: ''
      };
      settings.customSectors = settings.customSectors || [];
      settings.customSectors.push(cs);
      await put('settings', 'customSectors', settings.customSectors);
      if (state.diagramData && !state.diagramRef) await put('settings', 'diagram_' + key, state.diagramData);
      applyCustomSectors();
      // default noDiagram on new defensas records optional - applied when opening blank + noDiagramDefault
      alert('Setor criado.');
      sectors();
    };
  };
  paint();
}

async function deleteCustomSector(si) {
  const s = D[si];
  if (!s) return;
  const csList = settings.customSectors || [];
  const ix = csList.findIndex(c => c.key === s[1] && c.name === s[0]);
  if (ix < 0) return alert('Só setores personalizados podem ser excluídos por aqui.');
  if (!confirm('Excluir o setor "' + s[0] + '" e TODAS as inspeções/fotos/diagrama dele? Não pode ser desfeito.')) return;
  for (const [id] of list(si)) await del('records', key(si, id));
  await del('settings', 'diagram_' + s[1]);
  csList.splice(ix, 1);
  settings.customSectors = csList;
  await put('settings', 'customSectors', csList);
  // rebuild D entry: remove from D
  D.splice(si, 1);
  if (typeof BERCO_INFO !== 'undefined' && BERCO_INFO.length > si) BERCO_INFO.splice(si, 1);
  delete M[s[1]];
  // re-apply remaining custom (indices ok)
  alert('Setor excluído.');
  sectors();
}

openDB().catch(() => { noDB = true; }).then(async () => {
  settings.extra = await get('settings', 'extra') || {};
  settings.removed = await get('settings', 'removed') || {};
  settings.order = await get('settings', 'order') || {};
  settings.inspectorName = await get('settings', 'inspectorName') || '';
  settings.contractNumber = await get('settings', 'contractNumber') || 'SPA/12.2025';
  settings.contractor = await get('settings', 'contractor') || 'Autoridade Portuária de Santos';
  settings.customSectors = await get('settings', 'customSectors') || [];
  settings.sectorRenames = await get('settings', 'sectorRenames') || {};
  applyCustomSectors();
  settings.defensaRenames = await get('settings', 'defensaRenames') || {};
  Object.keys(settings.defensaRenames || {}).forEach(k => {
    const si = +k, renames = settings.defensaRenames[k] || {};
    if (!D[si]) return;
    D[si][2].forEach(pair => { if (renames[pair[0]]) pair[0] = renames[pair[0]]; });
    if (settings.extra && settings.extra[si]) settings.extra[si] = settings.extra[si].map(id => renames[id] || id);
    if (settings.order && settings.order[si]) settings.order[si] = settings.order[si].map(id => renames[id] || id);
    if (settings.removed && settings.removed[si]) settings.removed[si] = settings.removed[si].map(id => renames[id] || id);
    const cs = (settings.customSectors || []).find(c => c.key === D[si][1]);
    if (cs && Array.isArray(cs.defensas)) cs.defensas = cs.defensas.map(id => renames[id] || id);
  });
  Object.keys(settings.sectorRenames || {}).forEach(k => {
    const i = +k;
    if (D[i] && settings.sectorRenames[k]) {
      D[i][0] = settings.sectorRenames[k];
      if (typeof BERCO_INFO !== 'undefined' && BERCO_INFO[i]) BERCO_INFO[i].berco = settings.sectorRenames[k];
    }
  });
  home();
}).catch(e => {
  app.innerHTML = 'Não foi possível abrir o armazenamento local deste navegador.';
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js?v=38').then(reg => {
    try { reg.update(); } catch (_) {}
  }).catch(() => {});
}
</script>
<script>
/* Bloqueio de zoom por gesto de pinça e toque duplo (iOS ignora user-scalable=no) */
(function(){
  const stop = e => e.preventDefault();
  ['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, stop, { passive: false }));
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastEnd < 350 && !e.target.closest('button,a,input,select,textarea,label,summary,.item,.handle,[data-a],canvas,video')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  document.addEventListener('dblclick', e => { if (!e.target.closest('input,textarea,select')) e.preventDefault(); }, { passive: false });
})();
</script>
